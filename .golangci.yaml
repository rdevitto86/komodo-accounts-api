version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - misspell
    - gosec
    - cyclop
    - gocognit
    - wrapcheck
    - errorlint
    - contextcheck

  settings:
    cyclop:
      max-complexity: 15

    gocognit:
      min-complexity: 20

    gosec:
      excludes:
        - G115

    revive:
      rules:
        - name: exported
          disabled: true
        - name: var-naming
          disabled: true
        - name: error-return
          disabled: false

    wrapcheck:
      ignore-package-globs:
        - github.com/rdevitto86/komodo-forge-sdk-go/*

    errorlint:
      errorf: true
      comparison: true

  exclusions:
    paths:
      - deploy/cdk/node_modules

    rules:
      - path: "_test\\.go"
        linters:
          - wrapcheck
          - gosec
          - errcheck
          - cyclop
          - gocognit

      - path: "main\\.go"
        linters:
          - contextcheck

      - path: "(internal|src)/config/"
        linters:
          - gosec
        text: "G101"

      - linters:
          - contextcheck
        text: "->emit` should pass the context parameter"

      - path: "cmd/server/setup\\.go"
        linters:
          - gosec
        text: "G101"

      - path: "internal/clients/auth\\.go"
        linters:
          - gosec
        text: "G101"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
