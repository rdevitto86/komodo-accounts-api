on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Setup Go
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Build
      - name: Build
        run: go build ./...

      # Vet
      - name: Vet
        run: go vet ./...

      # Lint
      - uses: golangci/golangci-lint-action@v8

      # Test tier: component on PR, integration on merge to main
      - name: Set test tier
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TEST_TIER=component" >> "$GITHUB_ENV"
          else
            echo "TEST_TIER=integration" >> "$GITHUB_ENV"
          fi

      # Test (race + cover)
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      # Coverage floor: statement-weighted, per package, non-regressing
      - name: Coverage floor
        run: |
          awk '
            NR == 1 { next }
            /\.gen\.go:/ || /\/test\/mocks\// || /\/cmd\// { next }
            {
              split($1, f, ":")
              n = split(f[1], d, "/")
              pkg = d[1]
              for (i = 2; i < n; i++) pkg = pkg "/" d[i]
              total[pkg] += $2
              if ($3 > 0) covered[pkg] += $2
            }
            END {
              floors["komodo-accounts-api/internal/api"] = 76
              floors["komodo-accounts-api/internal/db"] = 41
              for (p in total) {
                floor = (p in floors) ? floors[p] : 80
                pct = covered[p] * 100 / total[p]
                printf "%-45s %6.1f%% (floor %d%%)\n", p, pct, floor
                if (pct < floor) {
                  printf "FAIL: %s coverage %.1f%% < %d%%\n", p, pct, floor
                  fail = 1
                }
              }
              exit fail
            }
          ' coverage.out

      # Security scan
      - name: Security scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
